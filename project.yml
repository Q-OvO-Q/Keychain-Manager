name: KeychainManager
options:
  bundleIdPrefix: com.cdn
targets:
  KeychainManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Source]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cdn.keychainmanager
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: NO
        # 图标由 Tools/make_icon.py 生成，改设计就重跑它
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Source/Info.plist
      properties:
        UILaunchScreen: {}
        # 详情页「解锁读取」会对受 SecAccessControl 保护的条目触发生物识别。
        # 缺少此键时系统会直接终止进程，而不是返回错误。
        NSFaceIDUsageDescription: 使用 Face ID 读取受保护的 Keychain 条目内容
